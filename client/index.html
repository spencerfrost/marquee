<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020617" />
    <meta
      name="description"
      content="Discover and browse movies and TV shows, with detail pages, cast and crew, episode ratings, and more."
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://marquee.mrspinn.ca/" />
    <title>Marquee — Movie &amp; TV Discovery</title>

    <!-- Social link previews (Open Graph + Twitter/X). Crawlers don't run JS, so these
         are static and apply to every URL; og:image must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marquee" />
    <meta property="og:url" content="https://marquee.mrspinn.ca/" />
    <meta property="og:title" content="Marquee — Movie &amp; TV Discovery" />
    <meta
      property="og:description"
      content="Find your next movie or show worth watching. Deep filters, ratings, cast and crew, episode heatmaps, and where to stream it."
    />
    <meta property="og:image" content="https://marquee.mrspinn.ca/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Marquee logo and tagline beside a colour-coded grid of episode ratings, framed by marquee lights."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Marquee — Movie &amp; TV Discovery" />
    <meta
      name="twitter:description"
      content="Find your next movie or show worth watching. Deep filters, ratings, cast and crew, episode heatmaps, and where to stream it."
    />
    <meta name="twitter:image" content="https://marquee.mrspinn.ca/og-image.png" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <!-- This is the crucial line for Vite -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
